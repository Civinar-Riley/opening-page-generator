<h4>这是什么工具？</h4>
<p>生成可嵌入 SillyTavern（酒馆）角色卡的<strong>开场页组件</strong>——一个单段 HTML/CSS 代码片段，由酒馆助手（TavernHelper）在聊天中渲染。区块包括：欢迎标题、装饰背景、粒子动效、开场引言、动态时钟栏、随机事件区、掷骰判定区、倒计时区、时间线/进度区、角色简介（多角色）、问答折叠区、图片展示区、音频/BGM 播放区、开场白选择、分隔装饰线、免责声明、作者的话、自由 HTML、更新日志、入场闸门、解码文本、命运卡池、连击彩蛋和模糊揭示，共 24 种，均可启用/停用/拖拽排序（新增六种默认停用）。</p>

<h4>快速上手</h4>
<ol>
  <li><strong>模板配置</strong>：调整主题配色、动效档位（华丽/轻盈/关闭）与标题字体，展开各区块填写内容、勾选启用、拖拽排序、一键复制区块；顶部搜索框可按名称筛选区块。右侧实时预览。</li>
  <li><strong>预览</strong>：切换 📱手机 / 🖥PC 宽度和 🌙暗色 / ☀️亮色 主题模拟；↻ 刷新会重掷 <code>{{random}}</code> 等随机宏。</li>
  <li><strong>导出</strong>：选择两种嵌入方式之一复制代码，粘贴到酒馆中。</li>
</ol>

<h4>📊 状态栏生成（独立工具）</h4>
<p>MVU 变量框架状态栏生成功能已拆分为<strong>独立单文件工具</strong>（<code>MVU状态栏生成器.html</code>），双击即用：分组字段编辑、行动选项词库、七套面板变体、九件套一键生成、角色卡导入与一键写入。本工具不再包含状态栏功能；此前生成的交付物仍可正常使用，修改请到独立工具重新生成。</p>

<h4>快捷键</h4>
<ul>
  <li><strong>Ctrl+Z</strong>：撤销上一步操作（区块增删/排序/启用切换等，最多 20 步历史）</li>
  <li><strong>Ctrl+Shift+Z</strong> 或 <strong>Ctrl+Y</strong>：重做</li>
  <li><strong>Ctrl+S</strong>：立即保存</li>
</ul>
<p>💡 在输入框内按 Ctrl+Z 走浏览器原生文本撤销，与区块级撤销互不干扰。</p>

<h4>搜索与批量替换</h4>
<ul>
  <li><strong>区块搜索</strong>：区块列表顶部搜索框按名称实时筛选区块，清空即恢复全部。</li>
  <li><strong>全局搜索替换</strong>：点「🔄 搜索替换」，输入关键词自动列出全部匹配（覆盖角色/图片/曲目/问答子项与装饰区自定义花纹等文本字段）；用 ◀ ▶ 逐个定位并高亮所在区块，确认后「替换当前」或「替换全部」。误替换可用 Ctrl+Z 撤销。</li>
</ul>

<h4>区块预设</h4>
<p>欢迎标题、开场引言、随机事件、掷骰判定四类区块内置「📋 套用预设」下拉，一键填充常用风格模板（奇幻/赛博/校园/末日等），套用后仍可自由修改。</p>

<h4>区块详细说明</h4>

<h5>✨ 欢迎标题区</h5>
<p>主标题 + 副标题，支持 <code>{{char}}</code> 等宏。可选<strong>眉题</strong>：标题上方的小型大写宽字距文字（如 STORY OPENING），营造杂志刊头感。装饰风格可选：无、华丽辉光、故障风、荧光下划线、描边线框、双线夹注、书名括角『』、印章、丝带、渐变文字。</p>

<h5>🎨 装饰区</h5>
<p>控制整个开场页的背景和边框。背景类型：渐变、纯色、图片、噪点渐变。边框样式：实线、双线、虚线、点线、浮雕凹槽/凸脊、内嵌/外凸等。装饰花纹：星芒、分隔线、月相、花瓣、音符、爱心、波浪、菱形阵、自定义字符。可选<strong>顶部光带</strong>：容器上缘一条强调色亮线加内侧微光。</p>

<h5>💫 粒子动效区</h5>
<p>纯 JS+DOM 实现的 10 种粒子特效：流星、气泡、音符、余烬、雾气、萤火、花瓣、星辰、雨滴、星光。可调数量、速度、透明度。支持 <code>prefers-reduced-motion</code> 无障碍降级。</p>

<h5>📜 开场引言</h5>
<p>居中引号样式，支持宏。可添加署名（显示为「—— xxx」）。</p>

<h5>🕰️ 动态时钟栏</h5>
<p>实时时钟，支持宏：<code>{{weekday}}</code> 星期、<code>{{isotime}}</code> 时间、<code>{{date}}</code> 日期。默认格式：<code>◆ {{date}} · {{weekday}} · {{isotime}} ◆</code>。可配颜色、字号、对齐、辉光效果。内容支持内联 HTML（如 Font Awesome 图标 <code>&lt;i class="fa-solid fa-satellite-dish fa-spin"&gt;&lt;/i&gt;</code>）。</p>

<h5>🎲 随机事件区</h5>
<p>每行一条内容，三种抽取模式：</p>
<ul>
  <li><strong>整组随机</strong>：每次只显示其中一行，导出自动包装为 <code>{{random::…}}</code> 宏。</li>
  <li><strong>全部显示</strong>：所有行都渲染，各行内的宏独立随机。</li>
  <li><strong>全部随机排序</strong>：显示所有行但每次顺序打乱。</li>
</ul>
<p>⚠️ 行内避免使用 <code>::</code>（双冒号）；含 <code>}}</code> 的宏（如 <code>{{roll 2d6}}</code> 空格形式）导出时同样会被替换为兼容字符，建议统一使用标准双冒号语法。</p>

<h5>🎯 掷骰判定区</h5>
<p>骰子语法：<code>1d20</code>、<code>2d6+3</code>、<code>d100</code>。导出为酒馆 <code>{{roll::表达式}}</code> 宏。四种样式：卡片式（大数字）、胶囊式（紧凑标签）、扑克牌（竖向卡片）、RPG 风（深色面板）。预览中点「↻ 刷新」可重掷。</p>

<h5>⏳ 倒计时区</h5>
<p>实时倒计时，按访问者设备的本地时间每秒刷新；目标时间已过则显示完成文案。适合活动开始时间、章节解锁、公测倒计时等场景。</p>

<h5>🗺️ 时间线/进度区</h5>
<p>竖向时间线展示剧情进度或编年史。每行一个节点，格式：<code>标题|描述|状态</code>，状态：<code>done</code> 已完成（金色实心圆点）、<code>current</code> 进行中（呼吸辉光）、<code>lock</code> 未解锁（半透明，默认）。描述文字中可包含 <code>|</code>（只有行末段恰为 done/current/lock 时才被识别为状态，其余竖线一律视为描述内容）。支持宏。</p>

<h5>👤 角色简介</h5>
<p>支持多角色，手动填写名称、描述、标签、头像 URL。数据内嵌在生成代码里，无需世界书条目。角色超过 2 个时自动折叠为名字列表，点击名字即可展开该角色的完整卡片。</p>

<h5>❓ 问答折叠区</h5>
<p>分组展示 Q&A，标题可点击折叠/展开整个区块，默认折叠。每组可添加多个问答条目，每个问答也可单独展开/收起，带平滑动画和箭头旋转指示。支持宏，适合放置世界观 FAQ、角色 Q&A、新手指引等内容。</p>

<h5>🖼️ 图片展示区</h5>
<p>支持 2/3/4 列网格布局，可添加多张图片（URL + 说明）。点击图片可全屏放大预览，点空白处或 Esc 关闭。</p>

<h5>🎵 音频/BGM 播放区</h5>
<p>自定义播放控件：播放/暂停、进度拖拽、音量、循环开关（🔁 亮 = 单曲循环，🔁 暗 = 播完停止）。支持浏览器原生可播的音频格式（MP3 等），填 URL 即可；填多条曲目时，后续曲目作为当前曲加载失败后的自动备用源。</p>

<h5>📋 开场白选择区</h5>
<p>运行时从 <code>getCharacter('current').first_messages</code> 动态渲染开场白列表，点击选项可直接切换到对应开场白。三种点击行为：</p>
<ul>
  <li><strong>切换到对应开场白</strong>（推荐）：点击即跳到该开场白。</li>
  <li><strong>填入输入框</strong>：<code>/setinput</code> 命令。</li>
  <li><strong>直接发送</strong>：选中后点按钮 <code>/send</code>。</li>
</ul>
<p>选项卡片显示标题和描述（带中文数字序号徽标与 → 箭头），支持自动提取或标题库世界书覆盖；可选列表上方的<strong>小节标题</strong>。</p>

<h5>➖ 分隔装饰线</h5>
<p>七种样式：菱形渐变线、星点、花朵线、波浪线、流光线（光点沿线往返巡游）、粗渐变条、纯渐变线。支持自定义中间文字。</p>

<h5>⚠️ 免责声明</h5>
<p>支持普通展示或折叠式（<code>&lt;details&gt;</code>）。</p>

<h5>✍️ 作者的话</h5>
<p>三种样式：普通展示、折叠式（<code>&lt;details&gt;</code>，默认样式即折叠）、卡片式（左强调竖线 + 小标题 + 卡片底）。支持宏。</p>

<h5>🧩 自由 HTML 区</h5>
<p>完全自由的 HTML 代码，支持宏。内置组件库（弹窗选择器，分类+搜索）可一键插入：进度条、标签组、引言框、信息卡片、音乐播放器、折叠面板、装饰分隔、公告栏、滚动文本框、状态行、AI 加载动画、心跳好感度条、随机台词框、折叠世界观面板、打字机文本框、多标签页、动态徽章、悬浮提示标签、对话气泡组、物品栏卡片、终端窗口、手写信笺、任务告示板、章节标题头、评价卡、日期事件卡、手机聊天窗口、好友列表、立绘展示位、宠物召唤兽卡、活动倒计时卡、求签占卜、翻转人物卡、契约印章、机密档案、直播频道卡、雷达扫描、监护仪、心电图、蒸汽压力表、沙漏倒计时、像素心跳、成就徽章、状态徽章、元素条、充能条、终端日志、跑马灯、系统通告、问答折叠分组、交互计数器、玻璃传送门、档案风进度条、档案物品清单、称号卡片网格等。</p>
<p>⚠️ 自由 HTML（含脚本）在<strong>预览与酒馆导出</strong>中均以完整权限运行（与页面同源，可访问浏览器本地数据）。<strong>勿粘贴不可信来源的代码。</strong></p>
<p>💡 酒馆环境注意：组件内的本地交互状态（折叠、标签页、点击揭示等）在楼层重渲染、swipe 或刷新后会<strong>自动复位</strong>——这是酒馆渲染机制决定的，属正常现象，不要依赖组件「记住」用户操作。</p>

<h5>🧾 更新日志区</h5>
<p>紧凑卡片列表展示版本历史，每行格式 <code>版本｜日期｜内容</code>（分隔符全角半角均可，内容可多段）。强调色版本徽标 + 暗色日期，斑马纹行底。</p>

<h5>🚪 入场闸门</h5>
<p>全屏封面在阅读前盖住页面。两种主题可选：<b>经典幕布</b>——显示标题、引言与「点击进入」按钮，点击后淡出揭开（纯 CSS 零脚本、零 API），适合悬疑/仪式感开场；<b>年龄验证（18+）</b>——审查站面板（警示斜纹 + 18+ 印章徽章 + 双按钮），「进入」仍为纯 CSS 揭开，「离开」经酒馆助手 <code>/close</code> 退出（无 API 时弹提示），并监听 <code>CHAT_CHANGED</code> 在切换聊天/角色卡时重新盖上。封面不参与主题「动效档位」的入场错峰，避免定位异常。</p>

<h5>🔎 解码文本区</h5>
<p>文本先以乱码字符呈现，再逐字「解码」成正文（行间错峰）——赛博/悬疑/克苏鲁卡的开场利器。跟随主题动效档位与系统减少动效偏好（关闭时直接显示正文），宏在解码开始前已由酒馆解析。</p>

<h5>🎴 命运卡池</h5>
<p>点击背面卡牌随机翻开一张并显示稀有度辉光，可反复抽取（纯客户端随机，无需酒馆 API）。卡池每行格式 <code>稀有度｜名称｜描述</code>，稀有度 SSR/SR/R/N（大小写不敏感）对应金/紫/蓝/灰，其他值回落灰色。</p>

<h5>🥚 连击彩蛋</h5>
<p>页面里埋一个低透明度的诱饵文字（默认 ✦），快速点击达指定次数（2-20）后随机揭示一条角色碎碎念，之后每次点击轮换台词。支持宏，适合藏角色小秘密。</p>

<h5>🌫️ 模糊揭示区</h5>
<p>每行一段的「点击显示」文本流：未点击的段以毛玻璃模糊 + 半透明遮罩盖住，遮罩上居中显示提示文字，点击该段即揭开（纯客户端交互，无需酒馆 API）。适合防剧透剧情、逐步解密文本、悬念信件。</p>

<h4>嵌入方式</h4>
<ul>
  <li><strong>开场白版</strong>：把导出的<strong>完整 HTML 文档（含 \`\`\` 代码围栏）</strong>整段贴进 first_mes 或某条 alternate_greetings。⚠️ 酒馆助手只渲染「位于代码块内且同时含 <code>&lt;body&gt;</code> 与 <code>&lt;/body&gt;</code> 标签」的代码，请勿删除围栏或 body 标签（正文自带 <code>\`\`\`</code> 时导出会自动升级为四反引号长围栏，无需手动处理）。</li>
  <li><strong>标记 + 正则</strong>：① 点「下载正则脚本 .json」，在酒馆 扩展 → 正则 → 导入（可选生效位置：AI 输出 / 用户输入 / 两者）；② 复制「标记文本」（默认 <code>【开场页】</code>）贴进某条开场白或世界书条目。标记文本可自定义。</li>
  <li><strong>导出页提示</strong>：长代码在导出页仅高亮显示前 2 万字符（超出部分提示截断），<strong>复制 / 下载始终为完整内容</strong>。正则脚本版可设 <strong>maxDepth 渲染楼层限制</strong>（如 0=仅最后一楼渲染）——AI 复读标记时旧楼不会重复渲染。</li>
</ul>

<h4>宏支持（预览模拟）</h4>
<p><code>{{char}}</code> <code>{{user}}</code> <code>{{random::a::b}}</code> <code>{{random:a,b}}</code>（旧版逗号兼容） <code>{{pick::a::b}}</code> <code>{{roll::2d6+3}}</code> <code>{{setvar::k::v}}</code> <code>{{getvar::k}}</code> <code>{{time}}</code> <code>{{isotime}}</code> <code>{{date}}</code> <code>{{isodate}}</code> <code>{{weekday}}</code> 及自定义宏；random/pick 的选项可包含一层花括号（如 <code>{{random::a{b}::c}}</code>）；<code>{{random_nr::a::b::c}}</code> 为不重复随机（避开上一次结果，候选耗尽后重置）。导出代码中宏原样保留，由酒馆运行时替换。</p>

<h4>数据保存</h4>
<ul>
  <li>所有工程自动保存在浏览器 localStorage（多工程可切换/复制/删除），换浏览器用顶栏「导出/导入工程」迁移（导出文件<strong>不包含 AI API Key</strong>，可放心分享）。顶栏「💾 保存」按钮可手动立即保存。</li>

  <li><strong>主题预设</strong>：主题风格卡片顶部内置 6 套成品配色（紫夜幻金/荆棘王室/狐火缘日/蓝电义体/渊语回廊/档案机），一键套用后仍可微调。</li>
  <li><strong>我的模板</strong>：顶栏「存为模板」把当前工程保存为模板；「新建」时可选从模板起步。</li>
  <li><strong>工具主题</strong>：顶栏下拉可切换 5 套工具自身界面主题——暖铜金（默认）/ 星夜 / 蓝图 / 磷光 / 深海，选择自动记忆。</li>
  <li>AI 助手为可选增强：接 OpenAI 兼容接口，可生成自由 HTML 区内容和主题配色；不填 Key 不影响其他功能。Key 仅<strong>明文保存在本地 localStorage</strong>（导出工程文件自动剔除，可放心分享）。填好 URL 与 Key 后点「🔄 获取模型列表」即可拉取 <code>/models</code> 填充模型下拉——此操作只读列表，不发送任何对话请求。</li>
  <li><strong>⟲ 重置</strong>：顶栏「⟲ 重置」三次递进确认后，清空所有本地数据（全部工程、我的模板、主题偏好）并恢复初始状态——重置前建议先「导出工程」备份。</li>
  <li><strong>页签排序</strong>：顶栏页签可按住拖拽调整顺序（自动记忆）；默认「模板配置」在最前、「使用说明」在最后，「⟲ 重置」恢复默认顺序。</li>
</ul>

<h4>运行要求</h4>
<ul>
  <li>酒馆需安装<strong>酒馆助手（TavernHelper / JS-slash-runner）</strong>扩展并启用。无 API 环境下组件自动显示占位内容。</li>
  <li><strong>版本建议</strong>：酒馆助手 ≥ 4.6.0（配合 SillyTavern ≥ 1.12.13）可解锁全部能力；<strong>BGM 的跨楼层接续播放需酒馆助手 ≥ 4.3.5</strong>（音频 API 4.0.0 引入）。旧版本自动降级：BGM 回落本地播放器（多楼层可能各自播放），其余功能不受影响。</li>
  <li>角色简介区支持三种头像来源：手动 URL、<strong>角色卡头像（零 JS）</strong>、<strong>用户头像（零 JS）</strong>——零 JS 模式由酒馆渲染器自动注入头像背景图，无需任何 API，兼容性最好。</li>
  <li>「跟随酒馆主题」可分别读取用户酒馆的正文色 / 引用色 / 字体 / 强调色（SmartTheme 变量），未生效时自动回落工程硬编码配色。</li>
  <li>图片展示区支持点击全屏放大预览。</li>
</ul>

<h4>真机排障清单（预览通过 ≠ 真机通过）</h4>
<ul>
  <li><strong>往回翻楼层界面消失</strong>：酒馆助手「渲染器」设置里的渲染深度不够——调大渲染深度即可（默认只渲染最近若干楼）。</li>
  <li><strong>界面闪烁 / 消失 / 重复渲染两份</strong>：多为插件冲突——油猴 HTML 注入器、翻译插件、Gemini 轮询类脚本与楼层渲染冲突，逐个禁用排查。</li>
  <li><strong>渲染完全空白</strong>：部分国产浏览器不支持 Blob URL 渲染——在酒馆助手设置中关闭 Blob 渲染，或换 Chrome / Edge。</li>
  <li><strong>长卡卡顿</strong>：开启酒馆助手的「代码折叠」、取消前端代码高亮、限制加载消息条数。</li>
  <li><strong>前端界面不支持流式渲染</strong>：生成回复时楼层前端可能暂不更新，回复完成后自动恢复。</li>
  <li><strong>导出前先看自检</strong>：导出页的自检与「兼容审查报告」会提示 <code>&lt;/script&gt;</code> 逃逸、体积超长、vw/vh 基准、position:fixed、Google Fonts 等已知坑，逐条核对再发卡。</li>
</ul>
