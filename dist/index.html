<h3>📖 使用说明 <span style="font-size:12px;opacity:.55">${e}</span></h3>

<h4>这是什么工具？</h4>
<p>生成可嵌入 SillyTavern（酒馆）角色卡的<strong>开场页组件</strong>——一个单段 HTML/CSS 代码片段，由酒馆助手（TavernHelper）在聊天中渲染。内置 25 种区块，覆盖标题装饰（欢迎/标题区、装饰区、粒子动效、时钟栏、分隔线）、剧情内容（开场引言、时间线、更新日志、作者的话、免责声明）、互动玩法（随机事件、掷骰判定、倒计时、问答折叠、命运卡池、连击彩蛋、模糊揭示、解码文本、入场闸门）、媒体展示（图片、BGM、漫画阅读器）与角色信息（角色简介、开场白选择），另有自由 HTML 区可从内置组件库一键插入现成组件；工程支持从角色卡（PNG/JSON/CHARX）与已导出的开场页 HTML 反向导入；全部区块均可启用/停用/拖拽排序（6 种核心区块默认启用，其余默认停用）。</p>

<h4>快速上手</h4>
<ol>
  <li><strong>模板配置</strong>：在「🎨 主题风格」卡套用预设（悬停可试穿）并微调背景/配色/字体/材质/动效，展开各区块填写内容、勾选启用、拖拽排序、一键复制区块；顶部搜索框可按名称筛选区块。右侧实时预览。</li>
  <li><strong>预览</strong>：切换 📱手机 / 🖥PC 宽度和 🌙暗色 / ☀️亮色 主题模拟；↻ 刷新会重掷 <code>{{random}}</code> 等随机宏。</li>
  <li><strong>导出</strong>：选择两种嵌入方式之一复制代码，粘贴到酒馆中。</li>
</ol>

<h4>📥 多路导入（角色卡 / 导出 HTML）</h4>
<ul>
  <li><strong>从角色卡导入</strong>：顶栏「新建」→「📥 从角色卡导入」，选酒馆角色卡 PNG / JSON / CHARX（V1/V2/V3 自动识别，解析纯本地进行），按卡内容勾选映射后生成新工程——开场白（first_mes + alternate_greetings）进开场白选择区占位列表，description + tags 进角色简介。卡自带的 character_book（角色设定世界书）不搬运——装卡时酒馆会自动读取它；开场白标题库草稿与之无关，在开场白区块手动维护（见下条）。在酒馆内打开工具时还可勾选「同时创建进酒馆」（走 createOrReplaceCharacter 直接建卡，结果以酒馆为准）。</li>
  <li><strong>从导出 HTML 反向导入</strong>：顶栏「新建」→「🧩 从导出 HTML 反向导入」，粘贴本工具导出的开场页 HTML（导出页 ① 完整文档，带代码围栏原文亦可），解析纯本地进行。<strong>完整恢复（推荐路径）</strong>：本版本导出的页面自带工程配置快照（data-opg-ver="2"），勾选的区块连同排版开关、颜色、字号、列数、封面音轨绑定等全部配置原样还原，导出 → 导入无损往返。<strong>轻量恢复（旧导出兜底）</strong>：旧版导出无快照，按区块作用域层认回内容草稿——排版开关与样式类配置（列数/颜色/字号等）不随产物保留，导入预览会逐区块标注「丢了什么」，按默认值回填；卡池/彩蛋等脚本型内容从产物内联脚本原样取回；同类型多实例合并；无版本锚的更老导出按尽力识别处理。认不出的段落整段进自由 HTML 区并标注「待认领」，手动整理即可。</li>
  <li><strong>标题库写入世界书</strong>：开场白选择区编辑器里的「📚 标题库草稿」框（<strong>手动维护</strong>，每行 <code>序号|标题|描述</code>，直接编辑）写好后可一键复制粘进酒馆世界书条目；在<strong>酒馆内</strong>打开工具时出现「📤 写入世界书」按钮——书不存在自动建，同名条目两步重建且不动书内其它条目，插入位置默认 before_character_definition、可选 outlet（酒馆助手 4.8.1+）。这些直写按钮靠检测酒馆助手 API 显隐，独立打开工具时不可见，用复制+手动粘贴替代。</li>
</ul>

<h4>快捷键</h4>
<ul>
  <li><strong>Ctrl+Z</strong>：撤销上一步操作（区块增删/排序/启用切换等，最多 20 步历史）</li>
  <li><strong>Ctrl+Shift+Z</strong> 或 <strong>Ctrl+Y</strong>：重做</li>
  <li><strong>Ctrl+S</strong>：立即保存</li>
</ul>
<p>💡 在输入框内按 Ctrl+Z 走浏览器原生文本撤销，与区块级撤销互不干扰。</p>

<h4>搜索与批量替换</h4>
<ul>
  <li><strong>区块搜索</strong>：区块列表顶部搜索框按名称实时筛选区块，清空即恢复全部。</li>
  <li><strong>全局搜索替换</strong>：点「🔄 搜索替换」，输入关键词自动列出全部匹配（覆盖角色/图片/曲目/问答子项与装饰区自定义花纹等文本字段）；用 ◀ ▶ 逐个定位并高亮所在区块，确认后「替换当前」或「替换全部」。误替换可用 Ctrl+Z 撤销。</li>
</ul>

<h4>区块预设</h4>
<p>欢迎标题、开场引言、随机事件、掷骰判定四类区块内置「📋 套用预设」下拉，一键填充常用风格模板（奇幻/赛博/校园/末日等），套用后仍可自由修改。</p>

<h4>📚 漫画导入（nhentai）</h4>
<p>「📚 漫画导入」页签配合<strong>本机辅助服务</strong>把 nhentai 画廊整本直链一键填进漫画阅读器区块，流程四步：</p>
<ol>
  <li><strong>启动服务</strong>：先跑一次 <code>npm run nh-install</code> 注册一键启动（Windows 本地协议，HKCU 无需管理员），之后在页面点 <strong>🚀 一键启动服务</strong>——首次浏览器询问一次是否打开，勾选始终允许后不再弹；服务窗口最小化常驻，点 <strong>⏹ 停止服务</strong> 或关窗口即停；也可手动 <code>npm run nh-serve</code>。</li>
  <li><strong>抓取与筛选</strong>：状态点变绿后贴入画廊链接抓取全本，缩略图网格里用 <strong>全选/反选/按页码选/去尾 N 页</strong> 或直接点击卡片勾掉不要的页（末尾广告页场景），选目标区块一键应用。</li>
  <li><strong>抓取代理</strong>：服务出网抓取需要能访问 nhentai 的网络——Node 默认不走系统代理，在「抓取代理」框填本机代理地址（Clash 默认 <code>http://127.0.0.1:7890</code>，v2rayN 默认 <code>http://127.0.0.1:10809</code>），改完即生效无需重启服务；留空则跟随系统环境变量或直连，CLI 也可用 <code>--proxy</code> 参数。</li>
  <li><strong>不折腾仓库的备选</strong>：工具单文件已内置<strong>「漫画导入助手」小包</strong>（零 npm 依赖，仍需本机 Node 18+），点 <strong>📦 导出助手小包</strong> 即得 ZIP（与 Releases 资产同源同字节），解压 → 双击「安装协议.bat」→ 回来点「🚀 一键启动服务」。也可不走页面，单次命令 <code>npm run nh -- 画廊链接 --skip-last 3</code> 直接把直链导出到剪贴板，回漫画区块「批量导入」框粘贴。</li>
</ol>
<p>服务之外，漫画区块的逐页编辑与批量粘贴照常可用，编辑器里可随时「🗑 清空全部页面」（Ctrl+Z 可撤销）。</p>

<h4>区块详细说明</h4>
<p>与配置页区块列表同序，点击条目展开详情。</p>

<details><summary>✨ 欢迎 / 标题区</summary><div><p>主标题 + 副标题，支持 <code>{{char}}</code> 等宏，视觉为「扉页题笺」：可选<strong>眉题</strong>（标题上方两侧渐隐引言线夹小型大写宽字距文字，如 STORY OPENING），主标题为 display 级题字（题字用墨色、刻线章印用主题强调色点睛），副标题为题款式小字（前置菱珠 + 字距），三行错峰入场。装饰风格十种：题笺刻线、华丽辉光（柔光 + 星点）、色差故障（主题双色错位 + 低频抖动）、荧光笔（划入高亮）、四角铭牌刻线、双线夹注、书名括角『』、篆印（楷书钤印轻旋转）、票根缎带、流光渐变（缓慢巡游）。</p></div></details>

<details><summary>🎨 装饰区</summary><div><p>控制开场页的边框与装饰氛围（背景自 v1.24 起移至「🎨 主题风格」卡统一管理）。边框样式：实线、双线、虚线、点线、浮雕凹槽/凸脊、内嵌/外凸等。装饰花纹：星芒、分隔线、月相、花瓣、音符、爱心、波浪、菱形阵、自定义字符。可选<strong>顶部光带</strong>：容器上缘一条强调色亮线加内侧微光。</p></div></details>

<details><summary>💫 粒子动效区</summary><div><p>纯 JS+DOM 实现的 10 种粒子特效：流星、气泡、音符、余烬、雾气、萤火、花瓣、星辰、雨滴、星光。可调数量、速度、透明度。支持 <code>prefers-reduced-motion</code> 无障碍降级。</p></div></details>

<details><summary>📜 开场引言</summary><div><p>居中引号样式，支持宏。可添加署名（显示为「—— xxx」）。</p></div></details>

<details><summary>🕰️ 动态时钟栏</summary><div><p>实时时钟，支持宏：<code>{{weekday}}</code> 星期、<code>{{isotime}}</code> 时间、<code>{{date}}</code> 日期。默认格式：<code>◆ {{date}} · {{weekday}} · {{isotime}} ◆</code>。可配颜色、字号、对齐、辉光效果。内容支持内联 HTML 与 emoji（如 <code>📡</code>、<code>&lt;span style="animation:opg-spin 1s linear infinite"&gt;↻&lt;/span&gt;</code>）。</p></div></details>

<details><summary>🎲 随机事件区</summary><div><p>每行一条内容，三种抽取模式：</p>
<ul>
  <li><strong>整组随机</strong>：每次只显示其中一行，导出自动包装为 <code>{{random::…}}</code> 宏。</li>
  <li><strong>全部显示</strong>：所有行都渲染，各行内的宏独立随机。</li>
  <li><strong>全部随机排序</strong>：显示所有行但每次顺序打乱。</li>
</ul>
<p>⚠️ 行内避免使用 <code>::</code>（双冒号）；含 <code>}}</code> 的宏（如 <code>{{roll 2d6}}</code> 空格形式）导出时同样会被替换为兼容字符，建议统一使用标准双冒号语法。</p></div></details>

<details><summary>🎯 掷骰判定区</summary><div><p>骰子语法：<code>1d20</code>、<code>2d6+3</code>、<code>d100</code>。导出为酒馆 <code>{{roll::表达式}}</code> 宏。四种样式：卡片式（大数字）、胶囊式（紧凑标签）、扑克牌（竖向卡片）、RPG 风（深色面板）。预览中点「↻ 刷新」可重掷。</p></div></details>

<details><summary>⏳ 倒计时区</summary><div><p>实时倒计时，按访问者设备的本地时间每秒刷新；目标时间已过则显示完成文案。适合活动开始时间、章节解锁、公测倒计时等场景。</p></div></details>

<details><summary>🗺️ 时间线/进度区</summary><div><p>竖向时间线展示剧情进度或编年史。每行一个节点，格式：<code>标题|描述|状态</code>，状态：<code>done</code> 已完成（金色实心圆点）、<code>current</code> 进行中（呼吸辉光）、<code>lock</code> 未解锁（半透明，默认）。描述文字中可包含 <code>|</code>（只有行末段恰为 done/current/lock 时才被识别为状态，其余竖线一律视为描述内容）。支持宏。</p></div></details>

<details><summary>👤 角色简介区</summary><div><p>支持多角色，手动填写名称、描述、标签、头像 URL。数据内嵌在生成代码里，无需世界书条目。视觉为「登场名录·立牌」：≤2 个角色渲染为并列主演的横向宽立牌（序号水印、强调色顶线、双框头像、渐变角色名）；超过 2 个自动收成「群像墙」网格——折叠显示序号与角色名，点击展开完整竖版立牌，卡片按主题动效档位逐卡错峰入场。头像三种来源：手动 URL、<strong>角色卡头像（零 JS）</strong>、<strong>用户头像（零 JS）</strong>——零 JS 模式由酒馆渲染器自动注入头像背景图，无需任何 API，兼容性最好。</p></div></details>

<details><summary>❓ 问答折叠区</summary><div><p>分组展示 Q&amp;A，标题可点击折叠/展开整个区块，默认折叠。每组可添加多个问答条目，每个问答也可单独展开/收起，带平滑动画和箭头旋转指示。支持宏，适合放置世界观 FAQ、角色 Q&amp;A、新手指引等内容。</p></div></details>

<details><summary>🖼️ 图片展示区</summary><div><p>支持 2/3/4 列网格布局，可添加多张图片（URL + 说明）。点击图片可全屏放大预览，点空白处或 Esc 关闭。</p></div></details>

<details><summary>🎵 音频/BGM 播放区</summary><div><p>自定义播放控件：播放/暂停、进度拖拽、音量、循环开关（🔁 亮 = 单曲循环，🔁 暗 = 播完停止）。支持浏览器原生可播的音频格式（MP3 等），填 URL 即可；填多条曲目时，后续曲目作为当前曲加载失败后的自动备用源。</p></div></details>

<details><summary>💌 开场白选择区</summary><div><p>运行时从 <code>getCharacter('current').first_messages</code> 动态渲染开场白列表，点击选项可直接切换到对应开场白。三种点击行为：</p>
<ul>
  <li><strong>切换到对应开场白</strong>（推荐）：点击即跳到该开场白。</li>
  <li><strong>填入输入框</strong>：<code>/setinput</code> 命令。</li>
  <li><strong>直接发送</strong>：选中后点按钮 <code>/send</code>。</li>
</ul>
<p>选项卡片显示标题和描述（带中文数字序号徽标，从 零 起数——零、壹、贰…，与 → 箭头），支持自动提取或标题库世界书覆盖；可选列表上方的<strong>小节标题</strong>。选项风格三种：<strong>卡片式</strong> / <strong>列表式</strong> / <strong>封面墙</strong>（16:9 大图海报网格，未配封面的条目用主题渐变占位 + 大序号水印）。开场白较多（≥6 条）时列表上方出现<strong>搜索框</strong>，按标题/描述/人物名即时过滤（工具预览中同样生效）；每条选项右侧有 <strong>👁 预览</strong>——先看全文再决定（读卡全文需在酒馆内，工具预览中点击会给出提示），预览弹层里直接「切换到此开场白 / 填入输入框 / 选中此项」（按点击行为分派），不怕点错直接切走；当前所在的开场白带 <code>aria-current</code> 标记，读屏与键盘用户可定位。</p>
<ul>
  <li><strong>封面与音轨</strong>：区块编辑器里逐项配置绑定标题、封面图 URL 与联动音轨 URL——<strong>按绑定标题匹配开场白</strong>（与列表标题一致才命中：自动提取时为开场白首行，标题库覆盖时为库内标题），卡里插入/删除/重排开场白不再错位；未填标题的项按序号对位（旧数据兼容，可用「📋 按占位列表补标题」一键升级为标题绑定）。开场白数多于配置项时多余项用默认样式。</li>
  <li><strong>联动音轨</strong>：点击切换开场白<strong>成功后</strong>自动循环播放对应音轨——音频挂在宿主文档（酒馆顶层），切换楼层不中断；选中未配音轨的开场白即停止。与 BGM 区块同时使用会叠播，请自行取舍。</li>
  <li><strong>排除标签</strong>：填标签名（逗号/顿号分隔，如 <code>status,设定</code>），自动提取标题、描述、人物名前先剥除这些标签的元素，避免把设定文本误当正文。</li>
  <li><strong>人物名</strong>：自动从开场白提取（「姓名：」类显式字段、<code>&lt;角色名&gt;</code> 标签、「名字：台词」说话人归属），去重后最多显示 3 个，可用开关关闭。</li>
  <li><strong>标题库草稿</strong>：手动维护的草稿框（每行 <code>序号|标题|描述</code>，直接编辑），配合世界书条目做「开场白标题库」运行时覆盖；在酒馆内打开工具可一键写入世界书（自动建书，见上方「多路导入」），非酒馆环境用「📋 复制」手动粘贴。</li>
</ul></div></details>

<details><summary>➖ 分隔装饰线</summary><div><p>七种样式：菱形渐变线、星点、花朵线、波浪线、流光线（光点沿线往返巡游）、粗渐变条、纯渐变线。支持自定义中间文字。</p></div></details>

<details><summary>⚠️ 免责声明区</summary><div><p>支持普通展示或折叠式（<code>&lt;details&gt;</code>）。</p></div></details>

<details><summary>🖋️ 作者的话</summary><div><p>三种样式：普通展示、折叠式（<code>&lt;details&gt;</code>，默认样式即折叠）、卡片式（左强调竖线 + 小标题 + 卡片底）。支持宏。</p></div></details>

<details><summary>🧩 自由 HTML 区</summary><div><p>完全自由的 HTML 代码，支持宏。内置组件库（弹窗选择器，分类+搜索）可一键插入：进度条、标签组、引言框、信息卡片、音乐播放器、折叠面板、装饰分隔、公告栏、滚动文本框、状态行、AI 加载动画、心跳好感度条、随机台词框、折叠世界观面板、打字机文本框、多标签页、动态徽章、悬浮提示标签、对话气泡组、物品栏卡片、终端窗口、手写信笺、任务告示板、章节标题头、评价卡、日期事件卡、手机聊天窗口、好友列表、立绘展示位、宠物召唤兽卡、活动倒计时卡、求签占卜、翻转人物卡、契约印章、机密档案、直播频道卡、雷达扫描、监护仪、心电图、蒸汽压力表、沙漏倒计时、像素心跳、成就徽章、状态徽章、元素条、充能条、终端日志、跑马灯、系统通告、问答折叠分组、交互计数器、玻璃传送门、档案风进度条、档案物品清单、称号卡片网格等。其中<strong>音乐播放器</strong>默认不带音频/封面外链——粘贴后把直链填进 <code>data-src</code>（音频）与 <code>data-cover</code>（封面），<code>data-src</code> 留空时播放器自动隐藏；其余组件的示例图片为 picsum 占位图服务外链，可自行替换。</p>
<p>⚠️ 自由 HTML（含脚本）在<strong>预览与酒馆导出</strong>中均以完整权限运行（与页面同源，可访问浏览器本地数据）。<strong>勿粘贴不可信来源的代码。</strong></p>
<p>💡 酒馆环境注意：组件内的本地交互状态（折叠、标签页、点击揭示等）在楼层重渲染、swipe 或刷新后会<strong>自动复位</strong>——这是酒馆渲染机制决定的，属正常现象，不要依赖组件「记住」用户操作。</p></div></details>

<details><summary>🧾 更新日志区</summary><div><p>紧凑卡片列表展示版本历史，每行格式 <code>版本｜日期｜内容</code>（分隔符全角半角均可，内容可多段）。强调色版本徽标 + 暗色日期，斑马纹行底。</p></div></details>

<details><summary>🚪 入场闸门</summary><div><p>全屏封面在阅读前盖住页面。六种主题可选，前五种均为纯 CSS 零脚本、零 API，点击整面揭开（键盘 Tab 聚焦到隐藏开关后 Enter/Space 同样揭开，聚焦时封面显示描边）：<b>经典幕布</b>——标题、引言与「点击进入」按钮，点击后淡出；<b>剧场帷幕</b>——丝绒双开幕布 + 顶部帷幔，点击后幕布向两侧滑出；<b>封印法阵</b>——旋转符文环 + 菱形徽记，点击后封印扩散消散；<b>机密金库</b>——铆钉钢板 + 四辐转轮，点击后转轮旋转、闸门整扇升起；<b>生物识别</b>——指纹扫描面板 + 往复扫描线，点击后状态翻转为「验证通过」并淡出；<b>年龄验证（18+）</b>——审查站面板双按钮，「进入」纯 CSS 揭开，「离开」经酒馆助手 <code>/closechat</code> 关闭当前聊天退回主页（无 API 时弹提示），并监听 <code>CHAT_CHANGED</code> 在切换聊天/角色卡时重新盖上（唯一带脚本主题）。全部主题走页面主题令牌变色、支持「动效档位」与系统减弱动效降级；封面不参与主题入场错峰，避免定位异常。</p></div></details>

<details><summary>🔎 解码文本区</summary><div><p>文本先以乱码字符呈现，再逐字「解码」成正文（行间错峰）——赛博/悬疑/克苏鲁卡的开场利器。跟随主题动效档位与系统减少动效偏好（关闭时直接显示正文）；脚本不可用的渲染环境下正文保持隐藏、不会提前剧透。宏在解码开始前已由酒馆解析。</p></div></details>

<details><summary>🎴 命运卡池</summary><div><p>点击背面卡牌随机翻开一张并显示稀有度辉光，可反复抽取（纯客户端随机，无需酒馆 API）。卡池每行格式 <code>稀有度｜名称｜描述</code>，稀有度 SSR/SR/R/N（大小写不敏感）对应金/紫/蓝/灰，其他值回落灰色。</p></div></details>

<details><summary>🥚 连击彩蛋</summary><div><p>页面里埋一个低透明度的诱饵文字（默认 ✦），快速点击达指定次数（2-20）后随机揭示一条角色碎碎念，之后每次点击轮换台词。支持宏，适合藏角色小秘密。</p></div></details>

<details><summary>🌫️ 模糊揭示区</summary><div><p>每行一段的「点击显示」文本流：未点击的段以毛玻璃模糊 + 半透明遮罩盖住，遮罩上居中显示提示文字，点击该段即揭开（纯客户端交互，无需酒馆 API）。适合防剧透剧情、逐步解密文本、悬念信件。</p></div></details>

<details><summary>📚 漫画阅读器</summary><div><p>在开场页里嵌一部漫画：入口可选<strong>封面卡片</strong>（竖版封面 + 书腰标题 + 页数徽标，没填封面 URL 自动回落为横幅按钮）或<strong>横幅按钮</strong>，点击打开全屏阅读器（✕ 或 Esc 关闭，打开后焦点移入关闭钮，读屏以对话框语义播报）。阅读模式两种：<strong>条漫</strong>——图片无缝纵排上下滚动，适合长条图/竖屏条漫；<strong>翻页</strong>——单页显示，按钮或键盘 ←→ 切换并显示页码。漫画页用图床直链 URL，逐页添加或用「批量导入」每行一个 URL 一次生成全部页（行内可用 <code>|</code> 追加页说明）。纯客户端交互，无需酒馆 API。</p></div></details>

<h4>嵌入方式</h4>
<ul>
  <li><strong>开场白版</strong>：把导出的<strong>完整 HTML 文档（含 \`\`\` 代码围栏）</strong>整段贴进 first_mes 或某条 alternate_greetings。⚠️ 酒馆助手只渲染「位于代码块内且同时含 <code>&lt;body&gt;</code> 与 <code>&lt;/body&gt;</code> 标签」的代码，请勿删除围栏或 body 标签（正文自带 <code>\`\`\`</code> 时导出会自动升级为四反引号长围栏，无需手动处理）。</li>
  <li><strong>标记 + 正则</strong>：① 点「下载正则脚本 .json」，在酒馆 扩展 → 正则 → 导入（可选生效位置：AI 输出 / 用户输入 / 两者）；② 复制「标记文本」（默认 <code>【开场页】</code>）贴进某条开场白或世界书条目。标记文本可自定义。</li>
  <li><strong>导出页提示</strong>：长代码在导出页仅高亮显示前 2 万字符（超出部分提示截断），<strong>复制 / 下载始终为完整内容</strong>；「👁 新窗看产物」可在本地直接打开最终成品，贴进酒馆前做最后一眼核对。正则脚本版预览省略超长 replaceString（placement 等选项字段完整可见），可设 <strong>maxDepth 渲染楼层限制</strong>（如 0=仅最后一楼渲染）——AI 复读标记时旧楼不会重复渲染。</li>
  <li><strong>图片连通性</strong>：付印审读区对全工程图片 URL（图库 / 漫画封面与页 / 头像 / 主题背景 / 自由 HTML 内 img）逐个探测加载，8 秒未响应单独标注「可能只是慢」——失效仅提示不阻断导出，贴进酒馆前顺手核对一遍图源。</li>
</ul>

<h4>宏支持（预览模拟）</h4>
<p><code>{{char}}</code> <code>{{user}}</code> <code>{{random::a::b}}</code> <code>{{random:a,b}}</code>（旧版逗号兼容） <code>{{pick::a::b}}</code> <code>{{roll::2d6+3}}</code> <code>{{setvar::k::v}}</code> <code>{{getvar::k}}</code> <code>{{time}}</code> <code>{{isotime}}</code> <code>{{date}}</code> <code>{{isodate}}</code> <code>{{weekday}}</code> 及自定义宏；random/pick 的选项可包含一层花括号（如 <code>{{random::a{b}::c}}</code>）；<code>{{random_nr::a::b::c}}</code> 为不重复随机（避开上一次结果，候选耗尽后重置）。导出代码中宏原样保留，由酒馆运行时替换。</p>

<h4>🎨 主题系统</h4>
<ul>
  <li><strong>主题预设</strong>：主题风格卡内置 6 套成品观感，保留原名：紫夜幻金＝紫夜星穹（紫电流金、衬线标题、星弧流光）、荆棘王室＝王室藏书票（绯红旧银、衬线标题）、狐火缘日＝狐火夜祭（朱砂狐青、楷字/噪点）、蓝电义体＝义体检修终端（冰蓝信号橙、网格）、渊语回廊＝深渊潮汐（深海珍珠、同心潮线/大圆角）、档案机＝旧档案卷宗（炭黑黄铜、等宽标题/横线/静态）。每套含<strong>字体+材质+配色+背景+动效</strong>——悬停试穿不改工程、点击套用可撤销，两者使用同一套配置；切到任一预设都会复位上一套的材质与字体，不残留。</li>
  <li><strong>微调与兼容</strong>：「主题材质 / 版式」可单选，选「经典（无附加材质）」关闭附加材质；字体/材质等微调偏离已套预设时标「已自定义（基于 X）」。新工程默认 <code>skin=classic</code>；旧工程缺失或未知材质按 classic 渲染，不按 <code>presetRef</code> 自动换肤，主动套用才启用新版观感。套用不改区块内容、装饰花纹或标题装饰设置；背景自 v1.24 起归主题管理，旧背景自动迁移保留。主题字体只用本机字体栈与系统回落，不新增外链字体、运行时依赖或酒馆 API。</li>
  <li><strong>跟随酒馆主题</strong>：主题卡「高级」折叠区里可分别读取用户酒馆的正文色 / 引用色 / 字体 / 强调色（SmartTheme 变量），未生效时自动回落工程硬编码配色。</li>
  <li><strong>对比度提示</strong>：文字色对背景不足 <strong>4.5:1</strong>、强调色不足 <strong>3:1</strong> 时显示警示，不阻止保存；按背景主色估算，图片背景按兜底底色估算，仍需在预览中核对实际可读性。</li>
  <li><strong>工具主题</strong>：顶栏下拉可切换 7 套工具自身界面主题——暖铜金（默认）/ 星夜 / 蓝图 / 磷光 / 深海 / 绯幕 / 月岩，选择自动记忆；仅改变工具界面，不影响页面主题或导出内容。</li>
</ul>

<h4>💾 数据与设置</h4>
<ul>
  <li><strong>存储与迁移</strong>：所有工程自动保存在浏览器 localStorage（多工程可切换/复制/删除），换浏览器用顶栏「导出/导入工程」迁移（导出文件<strong>不包含 AI API Key</strong>，可放心分享）。顶栏「💾 保存」按钮可手动立即保存。两个标签页同时改同一工程时，后保存的一方会覆盖另一方——检测到会弹提示，建议先「导出工程」备份。</li>
  <li><strong>工程快照</strong>：顶栏「📸 快照」把当前工程的完整副本手动存进浏览器 IndexedDB（与 localStorage 分开存储，工程数据损坏或超限时仍有底），恢复一律生成新工程不覆盖现有数据；最多保留 20 份，超出自动删最旧。改完一版存一份，配合 20 步撤销栈与「导出工程」文件三重兜底。</li>
  <li><strong>粘贴图片自动压缩</strong>：直接把截图/复制的图片 <code>Ctrl+V</code> 进任何输入框，会先在本地用 canvas 限宽压缩（WebP/JPEG 质量递减到约 180KB 内）再入库，避免超大 base64 撑爆 localStorage；已足够小的图与 GIF 原样保留。复制文字/图片地址等带文本的粘贴不受影响。</li>
  <li><strong>我的模板</strong>：顶栏「存为模板」把当前工程保存为模板；「新建」时可选从模板起步。</li>
  <li><strong>AI 助手</strong>：可选增强，接 OpenAI 兼容接口生成内容与主题配色；生成目标可选<strong>自由 HTML / 开场白正文 / 角色简介 / 时间线节点 / 问答组</strong>，生成后直接追加进对应区块（开场白正文追加进占位列表，问答按「分组|问题|答案」行解析入组），最近 5 份草稿本机暂存可恢复或丢弃；在酒馆内打开工具时可选「酒馆当前源」渠道（走酒馆助手 generate，与自带 API 配置并存）。不填 Key 不影响其他功能。Key 仅<strong>明文保存在本地 localStorage</strong>（导出工程文件自动剔除，可放心分享）。填好 URL 与 Key 后点「🔄 获取模型列表」即可拉取 <code>/models</code> 填充模型下拉——此操作只读列表，不发送任何对话请求。</li>
  <li><strong>⟲ 重置</strong>：顶栏「⟲ 重置」三次递进确认后，清空所有本地数据（全部工程、我的模板、主题偏好）并恢复初始状态——重置前建议先「导出工程」备份。</li>
  <li><strong>页签排序</strong>：顶栏页签可按住拖拽调整顺序（自动记忆）；默认「模板配置」在最前、「使用说明」在最后，「⟲ 重置」恢复默认顺序。</li>
</ul>

<h4>运行要求</h4>
<ul>
  <li>酒馆需安装<strong>酒馆助手（TavernHelper / JS-slash-runner）</strong>扩展并启用。无 API 环境下组件自动显示占位内容。</li>
  <li><strong>版本建议</strong>：酒馆助手 ≥ 4.6.0（配合 SillyTavern ≥ 1.12.13）可解锁全部能力；<strong>BGM 的跨楼层接续播放需酒馆助手 ≥ 4.3.5</strong>（音频 API 4.0.0 引入）。旧版本自动降级：BGM 回落本地播放器（多楼层可能各自播放），其余功能不受影响。</li>
</ul>

<h4>真机排障清单（预览通过 ≠ 真机通过）</h4>
<ul>
  <li><strong>往回翻楼层界面消失</strong>：酒馆助手「渲染器」设置里的渲染深度不够——调大渲染深度即可（默认只渲染最近若干楼）。</li>
  <li><strong>界面闪烁 / 消失 / 重复渲染两份</strong>：多为插件冲突——油猴 HTML 注入器、翻译插件、Gemini 轮询类脚本与楼层渲染冲突，逐个禁用排查。</li>
  <li><strong>渲染完全空白</strong>：部分国产浏览器不支持 Blob URL 渲染——在酒馆助手设置中关闭 Blob 渲染，或换 Chrome / Edge。</li>
  <li><strong>长卡卡顿</strong>：开启酒馆助手的「代码折叠」、取消前端代码高亮、限制加载消息条数。</li>
  <li><strong>前端界面不支持流式渲染</strong>：生成回复时楼层前端可能暂不更新，回复完成后自动恢复。</li>
  <li><strong>导出前先看自检</strong>：导出页的自检与「兼容审查报告」会提示 <code>&lt;/script&gt;</code> 逃逸、体积超长、vw/vh 基准、position:fixed、Google Fonts 等已知坑，逐条核对再发卡。</li>
</ul>
