<body>

<div id="topbar">
  <span class="logo">企鹅 · 酒馆开场页生成器</span>
  <select id="projectSelect" title="切换工程"></select>
  <button class="btn small" data-action="project-new">新建</button>
  <button class="btn ghost small" data-action="project-dup">复制</button>
  <button class="btn ghost small" data-action="project-tpl">存为模板</button>
  <button class="btn ghost small" data-action="project-rename">重命名</button>
  <button class="btn danger small" data-action="project-del">删除</button>
  <button class="btn ghost small" data-action="project-save">💾 保存</button>
  <select id="themeSelect" title="工具主题"></select>
  <span style="flex:1"></span>
  <button class="btn ghost small" data-action="project-export">导出工程</button>
  <button class="btn ghost small" data-action="project-import">导入工程</button>
  <button class="btn danger small" data-action="factory-reset" title="清空所有本地数据并恢复初始状态（三次确认）">⟲ 重置</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</div>

<div id="tabs">
  <button type="button" class="tab active" data-page="pageConfig">模板配置</button>
  <button type="button" class="tab" data-page="pagePreview">预览</button>
  <button type="button" class="tab" data-page="pageExport">导出</button>
  <button type="button" class="tab" data-page="pageStatus">状态栏生成</button>

<h3>📖 使用说明 <span style="font-size:12px;opacity:.55">${e}</span></h3>

<h4>这是什么工具？</h4>
<p>生成可嵌入 SillyTavern（酒馆）角色卡的<strong>开场页组件</strong>——一个单段 HTML/CSS 代码片段，由酒馆助手（TavernHelper）在聊天中渲染。区块包括：欢迎标题、装饰背景、粒子动效、开场引言、动态时钟栏、随机事件区、掷骰判定区、倒计时区、时间线/进度区、角色简介（多角色）、问答折叠区、图片展示区、音频/BGM 播放区、开场白选择、分隔装饰线、免责声明、作者的话和自由 HTML，共 18 种，均可启用/停用/拖拽排序。</p>

<h4>快速上手</h4>
<ol>
  <li><strong>模板配置</strong>：调整主题配色，展开各区块填写内容、勾选启用、拖拽排序、一键复制区块；顶部搜索框可按名称筛选区块。右侧实时预览。</li>
  <li><strong>预览</strong>：切换 📱手机 / 🖥PC 宽度和 🌙暗色 / ☀️亮色 主题模拟；↻ 刷新会重掷 <code>{{random}}</code> 等随机宏。</li>
  <li><strong>导出</strong>：选择两种嵌入方式之一复制代码，粘贴到酒馆中。</li>
</ol>

<h4>快捷键</h4>
<ul>
  <li><strong>Ctrl+Z</strong>：撤销上一步操作（区块增删/排序/启用切换等，最多 20 步历史）</li>
  <li><strong>Ctrl+Shift+Z</strong> 或 <strong>Ctrl+Y</strong>：重做</li>
  <li><strong>Ctrl+S</strong>：立即保存</li>
</ul>
<p>💡 在输入框内按 Ctrl+Z 走浏览器原生文本撤销，与区块级撤销互不干扰。</p>

<h4>搜索与批量替换</h4>
<ul>
  <li><strong>区块搜索</strong>：区块列表顶部搜索框按名称实时筛选区块，清空即恢复全部。</li>
  <li><strong>全局搜索替换</strong>：点「🔄 搜索替换」，输入关键词自动列出全部匹配（覆盖角色/图片/曲目/问答子项与装饰区自定义花纹等文本字段）；用 ◀ ▶ 逐个定位并高亮所在区块，确认后「替换当前」或「替换全部」。误替换可用 Ctrl+Z 撤销。</li>
</ul>

<h4>区块预设</h4>
<p>欢迎标题、开场引言、随机事件、掷骰判定四类区块内置「📋 套用预设」下拉，一键填充常用风格模板（奇幻/赛博/校园/末日等），套用后仍可自由修改。</p>

<h4>区块详细说明</h4>

<h5>✨ 欢迎标题区</h5>
<p>主标题 + 副标题，支持 <code>{{char}}</code> 等宏。装饰风格可选：无、华丽辉光、故障风、荧光下划线、描边线框、双线夹注、书名括角『』、印章、丝带、渐变文字。</p>

<h5>🎨 装饰区</h5>
<p>控制整个开场页的背景和边框。背景类型：渐变、纯色、图片、噪点渐变。边框样式：实线、双线、虚线、点线、浮雕凹槽/凸脊、内嵌/外凸等。装饰花纹：星芒、分隔线、月相、花瓣、音符、爱心、波浪、菱形阵、自定义字符。</p>

<h5>💫 粒子动效区</h5>
<p>纯 JS+DOM 实现的 10 种粒子特效：流星、气泡、音符、余烬、雾气、萤火、花瓣、星辰、雨滴、星光。可调数量、速度、透明度。支持 <code>prefers-reduced-motion</code> 无障碍降级。</p>

<h5>📜 开场引言</h5>
<p>居中引号样式，支持宏。可添加署名（显示为「—— xxx」）。</p>

<h5>🕰️ 动态时钟栏</h5>
<p>实时时钟，支持宏：<code>{{weekday}}</code> 星期、<code>{{isotime}}</code> 时间、<code>{{date}}</code> 日期。默认格式：<code>◆ {{date}} · {{weekday}} · {{isotime}} ◆</code>。可配颜色、字号、对齐、辉光效果。内容支持内联 HTML（如 Font Awesome 图标 <code>&lt;i class="fa-solid fa-satellite-dish fa-spin"&gt;&lt;/i&gt;</code>）。</p>

<h5>🎲 随机事件区</h5>
<p>每行一条内容，三种抽取模式：</p>
<ul>
  <li><strong>整组随机</strong>：每次只显示其中一行，导出自动包装为 <code>{{random::…}}</code> 宏。</li>
  <li><strong>全部显示</strong>：所有行都渲染，各行内的宏独立随机。</li>
  <li><strong>全部随机排序</strong>：显示所有行但每次顺序打乱。</li>
</ul>
<p>⚠️ 行内避免使用 <code>::</code>（双冒号）；含 <code>}}</code> 的宏（如 <code>{{roll 2d6}}</code> 空格形式）导出时同样会被替换为兼容字符，建议统一使用标准双冒号语法。</p>

<h5>🎯 掷骰判定区</h5>
<p>骰子语法：<code>1d20</code>、<code>2d6+3</code>、<code>d100</code>。导出为酒馆 <code>{{roll::表达式}}</code> 宏。四种样式：卡片式（大数字）、胶囊式（紧凑标签）、扑克牌（竖向卡片）、RPG 风（深色面板）。预览中点「↻ 刷新」可重掷。</p>

<h5>⏳ 倒计时区</h5>
<p>实时倒计时，按访问者设备的本地时间每秒刷新；目标时间已过则显示完成文案。适合活动开始时间、章节解锁、公测倒计时等场景。</p>

<h5>🗺️ 时间线/进度区</h5>
<p>竖向时间线展示剧情进度或编年史。每行一个节点，格式：<code>标题|描述|状态</code>，状态：<code>done</code> 已完成（金色实心圆点）、<code>current</code> 进行中（呼吸辉光）、<code>lock</code> 未解锁（半透明，默认）。描述文字中可包含 <code>|</code>（只有行末段恰为 done/current/lock 时才被识别为状态，其余竖线一律视为描述内容）。支持宏。</p>

<h5>👤 角色简介</h5>
<p>支持多角色，手动填写名称、描述、标签、头像 URL。数据内嵌在生成代码里，无需世界书条目。角色超过 2 个时自动折叠为名字列表，点击名字即可展开该角色的完整卡片。</p>

<h5>❓ 问答折叠区</h5>
<p>分组展示 Q&A，标题可点击折叠/展开整个区块，默认折叠。每组可添加多个问答条目，每个问答也可单独展开/收起，带平滑动画和箭头旋转指示。支持宏，适合放置世界观 FAQ、角色 Q&A、新手指引等内容。</p>

<h5>🖼️ 图片展示区</h5>
<p>支持 2/3/4 列网格布局，可添加多张图片（URL + 说明）。点击图片可全屏放大预览，点空白处或 Esc 关闭。</p>

<h5>🎵 音频/BGM 播放区</h5>
<p>自定义播放控件：播放/暂停、进度拖拽、音量、循环开关（🔁 亮 = 单曲循环，🔁 暗 = 播完停止）。支持浏览器原生可播的音频格式（MP3 等），填 URL 即可；填多条曲目时，后续曲目作为当前曲加载失败后的自动备用源。</p>

<h5>📋 开场白选择区</h5>
<p>运行时从 <code>getCharacter('current').first_messages</code> 动态渲染开场白列表，点击选项可直接切换到对应开场白。三种点击行为：</p>
<ul>
  <li><strong>切换到对应开场白</strong>（推荐）：点击即跳到该开场白。</li>
  <li><strong>填入输入框</strong>：<code>/setinput</code> 命令。</li>
  <li><strong>直接发送</strong>：选中后点按钮 <code>/send</code>。</li>
</ul>
<p>选项卡片显示标题和描述，支持自动提取或标题库世界书覆盖。</p>

<h5>➖ 分隔装饰线</h5>
<p>六种样式：菱形渐变线、星点、花朵线、波浪线、粗渐变条、纯渐变线。支持自定义中间文字。</p>

<h5>⚠️ 免责声明</h5>
<p>支持普通展示或折叠式（<code>&lt;details&gt;</code>）。</p>

<h5>✍️ 作者的话</h5>
<p>支持普通展示或折叠式（<code>&lt;details&gt;</code>，默认样式即折叠），支持宏。</p>

<h5>🧩 自由 HTML 区</h5>
<p>完全自由的 HTML 代码，支持宏。内置组件库可一键插入：进度条、标签组、引言框、信息卡片、音乐播放器、折叠面板、装饰分隔、公告栏、滚动文本框、状态行、AI 加载动画、心跳好感度条、随机台词框、折叠世界观面板、打字机文本框、多标签页、动态徽章、悬浮提示标签、对话气泡组、物品栏卡片、终端窗口、手写信笺、任务告示板、章节标题头、评价卡、日期事件卡。</p>
<p>⚠️ 自由 HTML（含脚本）在<strong>预览与酒馆导出</strong>中均以完整权限运行（与页面同源，可访问浏览器本地数据）。<strong>勿粘贴不可信来源的代码。</strong></p>

<h4>嵌入方式</h4>
<ul>
  <li><strong>开场白版</strong>：把导出的<strong>完整 HTML 文档（含 \`\`\` 代码围栏）</strong>整段贴进 first_mes 或某条 alternate_greetings。⚠️ 酒馆助手只渲染「位于代码块内且同时含 <code>&lt;body&gt;</code> 与 <code>&lt;/body&gt;</code> 标签」的代码，请勿删除围栏或 body 标签（正文自带 <code>\`\`\`</code> 时导出会自动升级为四反引号长围栏，无需手动处理）。</li>
  <li><strong>标记 + 正则</strong>：① 点「下载正则脚本 .json」，在酒馆 扩展 → 正则 → 导入（可选生效位置：AI 输出 / 用户输入 / 两者）；② 复制「标记文本」（默认 <code>【开场页】</code>）贴进某条开场白或世界书条目。标记文本可自定义。</li>
  <li><strong>导出页提示</strong>：长代码在导出页仅高亮显示前 2 万字符（超出部分提示截断），<strong>复制 / 下载始终为完整内容</strong>。</li>
</ul>

<h4>📋 状态栏生成器</h4>
<p>独立页签，从自定义字段一键生成「纯文本状态栏」三件套：<strong>① 世界书条目</strong>（蓝灯常驻 + @D 深度插入，教 AI 每楼按格式输出状态栏，可复制文案）、<strong>② 正则美化脚本</strong>（把 AI 输出的状态栏替换为跟随工程主题色的美化面板，仅影响显示不污染上下文）、<strong>③ 开场白后缀</strong>（纯文字状态栏示例，贴进 first_mes 末尾让第一楼就有效果）。另附「复制完整使用说明」。</p>
<ul>
  <li><strong>行式模式</strong>：AI 逐行输出「字段：值」，正则按字段名顺序严格捕获、静态模板插值——轻量稳定；字段必须齐全，缺字段该楼不渲染。</li>
  <li><strong>标签块模式</strong>：AI 在自定义标签（默认 <code>&lt;Status_block&gt;</code>）内输出，正则只替换标签块、正文保留；内嵌解析器动态渲染，AI 增删字段无需改正则。</li>
  <li><strong>行动选项（两种模式通用）</strong>：AI 以「行动选项：」+ 短横线列表逐条输出，美化面板渲染为按钮，点击填入输入框。内置 18 种行动方向词库（平滑/转折/揭秘/超展开等，可单选或组合，顺序即选项顺序），所选方向的定义会写入世界书供 AI 理解；也支持手动输入自定义方向。</li>
  <li><strong>美化面板</strong>：头部显示时间/地点胶囊，点击头部折叠/展开（收起时行动选项仍可见可点），⚙ 可调字号与布局（网格/列表），设置跨楼层记忆。面板为<strong>自持深色</strong>设计（≈94% 不透明），亮底/暗底聊天中均清晰可读。</li>
  <li><strong>六套布局变体</strong>：夜宴酒牌（卡片风）/ 紧凑网格 / 手稿扉页（点线引导）/ 黑客终端（黑绿等宽）/ 冰晶玻璃（毛玻璃深基底）/ 杂志排版（衬线分栏），一键切换；另有「布局微调」自由组合字段列数、间距、边框样式/宽度、圆角、标题栏样式（标准/居中/极简/下划线）与行动选项位置（底部/内嵌进面板）。</li>
  <li><strong>样式统筹</strong>：面板背景（跟随/透明/纯色/渐变/图片）、标签/值颜色与字体、行动选项三色（文字/背景/边框，显式设置后压过布局变体的默认观感）；「美化预设」内置 6 套成品，也可把自己的布局+样式组合存为预设。</li>
  <li><strong>字段预设</strong>：内置中性/参考完整/精简三套，可把自己的字段集存为预设；也可粘贴现成状态栏文本一键导入字段。</li>
</ul>

<h4>宏支持（预览模拟）</h4>
<p><code>{{char}}</code> <code>{{user}}</code> <code>{{random::a::b}}</code> <code>{{random:a,b}}</code>（旧版逗号兼容） <code>{{pick::a::b}}</code> <code>{{roll::2d6+3}}</code> <code>{{setvar::k::v}}</code> <code>{{getvar::k}}</code> <code>{{time}}</code> <code>{{isotime}}</code> <code>{{date}}</code> <code>{{isodate}}</code> <code>{{weekday}}</code> 及自定义宏；random/pick 的选项可包含一层花括号（如 <code>{{random::a{b}::c}}</code>）。导出代码中宏原样保留，由酒馆运行时替换。</p>

<h4>数据保存</h4>
<ul>
  <li>所有工程自动保存在浏览器 localStorage（多工程可切换/复制/删除），换浏览器用顶栏「导出/导入工程」迁移（导出文件<strong>不包含 AI API Key</strong>，可放心分享）。顶栏「💾 保存」按钮可手动立即保存。</li>

  <li><strong>主题预设</strong>：主题风格卡片顶部内置 5 套成品配色（紫夜幻金/荆棘王室/狐火缘日/蓝电义体/渊语回廊），一键套用后仍可微调。</li>
  <li><strong>我的模板</strong>：顶栏「存为模板」把当前工程保存为模板；「新建」时可选从模板起步。</li>
  <li><strong>工具主题</strong>：顶栏下拉可切换 5 套工具自身界面主题——暖铜金（默认）/ 星夜 / 蓝图 / 磷光 / 深海，选择自动记忆。</li>
  <li>AI 助手为可选增强：接 OpenAI 兼容接口，可生成自由 HTML 区内容和主题配色；不填 Key 不影响其他功能。Key 仅<strong>明文保存在本地 localStorage</strong>（导出工程文件自动剔除，可放心分享）。填好 URL 与 Key 后点「🔄 获取模型列表」即可拉取 <code>/models</code> 填充模型下拉——此操作只读列表，不发送任何对话请求。</li>
  <li><strong>⟲ 重置</strong>：顶栏「⟲ 重置」三次递进确认后，清空所有本地数据（全部工程、我的模板、字段/美化预设、主题偏好）并恢复初始状态——重置前建议先「导出工程」备份。</li>
</ul>
