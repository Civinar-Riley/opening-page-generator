<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企鹅的酒馆开场页生成器</title>
<!-- favicon 内联 SVG（emoji 即图标）：保持单文件自包含，换图标改这里的 emoji 或换成 base64 PNG -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="./css/tool.css">
</head>
<body>

<div id="topbar">
  <span class="logo">企鹅 · 酒馆开场页生成器<span class="ver">v__OPG_VERSION__ · 构建于 __OPG_BUILD_DATE__</span></span>
  <select id="projectSelect" title="切换工程"></select>
  <button type="button" class="btn small" data-action="project-new">新建</button>
  <button type="button" class="btn ghost small" data-action="project-dup">复制</button>
  <button type="button" class="btn ghost small" data-action="project-tpl">存为模板</button>
  <button type="button" class="btn ghost small" data-action="project-rename">重命名</button>
  <button type="button" class="btn danger small" data-action="project-del">删除</button>
  <button type="button" class="btn ghost small" data-action="project-save">💾 保存</button>
  <select id="themeSelect" title="工具主题"></select>
  <span style="flex:1"></span>
  <button type="button" class="btn ghost small" data-action="project-export">导出工程</button>
  <button type="button" class="btn ghost small" data-action="project-import">导入工程</button>
  <button type="button" class="btn danger small" data-action="factory-reset" title="清空所有本地数据并恢复初始状态（三次确认）">⟲ 重置</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</div>

<div id="tabs">
  <button type="button" class="tab active" data-page="pageConfig">模板配置</button>
  <button type="button" class="tab" data-page="pagePreview">预览</button>
  <button type="button" class="tab" data-page="pageExport">导出</button>
  <button type="button" class="tab" data-page="pageAI">AI 助手</button>
  <button type="button" class="tab" data-page="pageNh">📚 漫画导入</button>
  <button type="button" class="tab" data-page="pageHelp">使用说明</button>
  <a class="btn ghost small gh-link" href="https://github.com/Civinar-Riley/opening-page-generator" target="_blank" rel="noopener noreferrer" title="GitHub 仓库：源码与问题反馈" aria-label="GitHub 仓库：源码与问题反馈"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
</div>

<div id="main">

  <!-- ============ 模板配置 ============ -->
  <div class="page active" id="pageConfig">
    <div class="config-col" id="configCol"></div>
    <div class="preview-col" id="livePreviewSlot"></div>
  </div>

  <!-- ============ 预览 ============ -->
  <div class="page" id="pagePreview">
    <div class="preview-col" style="flex:1;margin:0 auto;width:100%"></div>
  </div>

  <!-- ============ 导出 ============ -->
  <div class="page" id="pageExport"><div class="config-col" id="exportCol" style="max-width:900px;margin:0 auto;width:100%"></div></div>

  <!-- ============ AI ============ -->
  <div class="page" id="pageAI"><div class="config-col" id="aiCol" style="max-width:760px;margin:0 auto;width:100%"></div></div>

  <!-- ============ 漫画导入 ============ -->
  <div class="page" id="pageNh"><div class="config-col" id="nhCol" style="max-width:860px;margin:0 auto;width:100%"></div></div>

  <!-- ============ 说明 ============ -->
  <div class="page" id="pageHelp"><div class="help-page" style="margin:0 auto;width:100%;overflow:auto;padding-right:8px"></div></div>

</div>

<div class="toast" id="toast"></div>

<script>window.OPG_VERSION='__OPG_VERSION__';</script>
<!-- 「漫画导入助手」小包（base64 ZIP，由 build.js 注入）：工具页「导出助手小包」按钮直接下载。
     内容与 npm run pack:helper 产出的 Release 资产同源同字节。开发模式占位为空串，按钮降级提示 -->
<script>window.OPG_HELPER_ZIP='__OPG_HELPER_ZIP__';</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
